name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: pushing again cancels the previous, in-flight run rather
# than paying for both. macOS minutes bill at 10x on private repos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the checkout; the token should not be able to do anything else.
permissions:
  contents: read

jobs:
  test:
    # Must be macos-26 or newer: MACOSX_DEPLOYMENT_TARGET is 26.0, and the test
    # bundle is hosted by the app — so on an older runner the app cannot launch and
    # the tests cannot run, even though the build would succeed.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Build and test
        run: |
          xcodebuild \
            -project Strata.xcodeproj \
            -scheme Strata \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            test
