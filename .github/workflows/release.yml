name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    # Must be macos-26 or newer: MACOSX_DEPLOYMENT_TARGET is 26.0, so the app cannot
    # launch on an older runner — which the test step below needs it to do.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # Deliberately before the certificate is imported: a broken tag should fail
      # here, not part-way through notarizing something nobody should install.
      - name: Run tests
        run: |
          xcodebuild \
            -project Strata.xcodeproj \
            -scheme Strata \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            test

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build app
        run: |
          # The tag is the version. Without this the shipped app reports whatever
          # MARKETING_VERSION happens to be committed, regardless of what was tagged.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version $VERSION (build $GITHUB_RUN_NUMBER)"

          xcodebuild \
            -project Strata.xcodeproj \
            -scheme Strata \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ secrets.SIGNING_IDENTITY }}" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            clean build

      - name: Create DMG
        run: |
          brew install create-dmg
          mkdir -p dist
          create-dmg \
            --volname "Strata" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 400 200 \
            "dist/Strata-${GITHUB_REF_NAME}.dmg" \
            "build/Build/Products/Release/Strata.app"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -e
          DMG="dist/Strata-${GITHUB_REF_NAME}.dmg"

          SUBMIT_JSON=$(xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --output-format json \
            --wait)
          echo "$SUBMIT_JSON"

          STATUS=$(echo "$SUBMIT_JSON" | jq -r .status)
          ID=$(echo "$SUBMIT_JSON" | jq -r .id)

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization status: $STATUS. Fetching notary log for $ID..."
            xcrun notarytool log "$ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" || true
            exit 1
          fi

          xcrun stapler staple "$DMG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/Strata-*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
