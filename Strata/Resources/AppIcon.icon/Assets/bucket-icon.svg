<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Bucket app icon — flat layered artwork for Icon Composer
    Layers (bottom to top): background / bucket / water / drop / cloud
    Palette:
      navy   #1D3E57  background
      coral  #E8825C  bucket body + handle
      burnt  #C2582A  rim + base band
      aqua   #96BFC7  water + drop
      cream  #E7E0CC  cloud
  -->

  <defs>
    <clipPath id="bucket-body-clip">
      <path d="M 212 560 L 297 900 A 215 48 0 0 0 727 900 L 812 560 A 300 66 0 0 1 212 560 Z"/>
    </clipPath>
  </defs>

  <!-- LAYER 1: background -->
  <g id="background">
    <rect x="0" y="0" width="1024" height="1024" fill="#1D3E57"/>
  </g>

  <!-- LAYER 2: bucket (handle + body + base band + rim) -->
  <g id="bucket">
    <!-- handle: short, thick arc; ends tuck behind the rim -->
    <path d="M 268 552 A 244 210 0 0 1 756 552"
          fill="none" stroke="#E8825C" stroke-width="28" stroke-linecap="round"/>
    <!-- body -->
    <path d="M 212 560 L 297 900 A 215 48 0 0 0 727 900 L 812 560 A 300 66 0 0 1 212 560 Z"
          fill="#E8825C"/>
    <!-- base band -->
    <rect x="200" y="830" width="624" height="44" fill="#C2582A"
          clip-path="url(#bucket-body-clip)"/>
    <!-- rim -->
    <ellipse cx="512" cy="560" rx="300" ry="66" fill="#C2582A"/>
  </g>

  <!-- LAYER 3: water (separate so it can get its own glass treatment) -->
  <g id="water">
    <ellipse cx="512" cy="568" rx="262" ry="54" fill="#96BFC7"/>
  </g>

  <!-- LAYER 4: drop -->
  <g id="drop">
    <path d="M 512 375 C 512 402 547 418 547 437 A 35 35 0 1 1 477 437 C 477 418 512 402 512 375 Z"
          fill="#96BFC7"/>
  </g>

  <!-- LAYER 5: cloud (opaque union of shapes, reads as one silhouette) -->
  <g id="cloud">
    <circle cx="424" cy="205" r="55" fill="#E7E0CC"/>
    <circle cx="512" cy="172" r="84" fill="#E7E0CC"/>
    <circle cx="606" cy="200" r="60" fill="#E7E0CC"/>
    <rect x="404" y="185" width="220" height="75" rx="20" fill="#E7E0CC"/>
  </g>
</svg>
